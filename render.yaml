services:
  # 1. Backend Web Service (FastAPI + Docker + FFmpeg)
  - type: web
    name: content-generalised-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: COBALT_API_URL
        value: https://co.wuk.sh
      - key: PORT
        value: 8000

  # 2. Frontend Static Site (Vite + React)
  - type: web
    name: content-generalised-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: content-generalised-backend
          property: host
