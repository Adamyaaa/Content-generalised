services:
  # Backend Web Service (FastAPI + Docker + FFmpeg)
  - type: web
    name: content-generalised-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: COBALT_API_URL
        value: https://co.wuk.sh
      - key: PORT
        value: 8000
